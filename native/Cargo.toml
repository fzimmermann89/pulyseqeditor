[workspace]
members = [
  "crates/core",
  "crates/cli",
  "crates/gui",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
base64 = "0.22.1"
deno_core = { version = "=0.330.0", default-features = true }
serde_json = "1.0.145"
tokio = { version = "1.51.1", features = ["rt", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
