name: Windows Native

on:
  push:
    branches: ["main", "next"]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend and stage native runtime
        run: npm run build:native-assets

      - name: Build native workspace
        run: cargo build --release
        working-directory: native

      - name: Stage CLI bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path native/out/pypulseq-cli/runtime | Out-Null
          Copy-Item native/target/release/pypulseq-cli.exe native/out/pypulseq-cli/
          Copy-Item -Recurse native/runtime/pyodide native/out/pypulseq-cli/runtime/
          Copy-Item -Recurse native/runtime/python_packages native/out/pypulseq-cli/runtime/
          Copy-Item native/runtime/python_packages.zip native/out/pypulseq-cli/runtime/
          Copy-Item -Recurse native/runtime/python_runtime native/out/pypulseq-cli/runtime/
          Copy-Item native/runtime/manifest.json native/out/pypulseq-cli/runtime/

      - name: Stage GUI bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path native/out/pypulseq-gui/runtime | Out-Null
          Copy-Item native/target/release/pypulseq-gui.exe native/out/pypulseq-gui/
          Copy-Item -Recurse native/runtime/pyodide native/out/pypulseq-gui/runtime/
          Copy-Item -Recurse native/runtime/python_packages native/out/pypulseq-gui/runtime/
          Copy-Item native/runtime/python_packages.zip native/out/pypulseq-gui/runtime/
          Copy-Item -Recurse native/runtime/python_runtime native/out/pypulseq-gui/runtime/
          Copy-Item native/runtime/manifest.json native/out/pypulseq-gui/runtime/
          Copy-Item -Recurse native/runtime/gui native/out/pypulseq-gui/runtime/

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: pypulseq-cli-windows
          path: native/out/pypulseq-cli

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: pypulseq-gui-windows
          path: native/out/pypulseq-gui

      - name: Archive CLI bundle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path native/out/pypulseq-cli/* -DestinationPath native/out/pypulseq-cli-windows.zip

      - name: Archive GUI bundle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path native/out/pypulseq-gui/* -DestinationPath native/out/pypulseq-gui-windows.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            native/out/pypulseq-cli-windows.zip
            native/out/pypulseq-gui-windows.zip
