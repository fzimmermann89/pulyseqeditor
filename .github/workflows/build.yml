name: Build

on:
  push:
    branches: ["main", "next"]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-assets:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.flags.outputs.pages_enabled }}
      release_enabled: ${{ steps.flags.outputs.release_enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend and stage native runtime
        run: npm run build:native-assets

      - name: Set workflow flags
        id: flags
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "pages_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "pages_enabled=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "release_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload shared asset bundle
        uses: actions/upload-artifact@v4
        with:
          name: shared-build-assets
          path: |
            dist
            native/runtime

  windows-cli:
    runs-on: windows-latest
    needs: prepare-assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native -> target

      - name: Download shared asset bundle
        uses: actions/download-artifact@v4
        with:
          name: shared-build-assets
          path: .

      - name: Build CLI
        run: cargo build --release -p pypulseq-cli
        working-directory: native

      - name: Stage CLI bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path native/out/pypulseq-cli | Out-Null
          Copy-Item native/target/release/pypulseq-cli.exe native/out/pypulseq-cli/

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: pypulseq-cli-windows
          path: native/out/pypulseq-cli

      - name: Archive CLI bundle
        if: needs.prepare-assets.outputs.release_enabled == 'true'
        shell: pwsh
        run: Compress-Archive -Path native/out/pypulseq-cli/* -DestinationPath native/out/pypulseq-cli-windows.zip

      - name: Upload CLI release zip
        if: needs.prepare-assets.outputs.release_enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pypulseq-cli-release-zip
          path: native/out/pypulseq-cli-windows.zip

  windows-gui:
    runs-on: windows-latest
    needs: prepare-assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native -> target

      - name: Download shared asset bundle
        uses: actions/download-artifact@v4
        with:
          name: shared-build-assets
          path: .

      - name: Build GUI
        run: cargo build --release -p pypulseq-gui
        working-directory: native

      - name: Stage GUI bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path native/out/pypulseq-gui | Out-Null
          Copy-Item native/target/release/pypulseq-gui.exe native/out/pypulseq-gui/

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: pypulseq-gui-windows
          path: native/out/pypulseq-gui

      - name: Archive GUI bundle
        if: needs.prepare-assets.outputs.release_enabled == 'true'
        shell: pwsh
        run: Compress-Archive -Path native/out/pypulseq-gui/* -DestinationPath native/out/pypulseq-gui-windows.zip

      - name: Upload GUI release zip
        if: needs.prepare-assets.outputs.release_enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pypulseq-gui-release-zip
          path: native/out/pypulseq-gui-windows.zip

  deploy-pages:
    if: needs.prepare-assets.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    needs: prepare-assets
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Download shared asset bundle
        uses: actions/download-artifact@v4
        with:
          name: shared-build-assets
          path: .

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-release:
    if: needs.prepare-assets.outputs.release_enabled == 'true'
    runs-on: ubuntu-latest
    needs:
      - prepare-assets
      - windows-cli
      - windows-gui
    steps:
      - name: Download CLI release zip
        uses: actions/download-artifact@v4
        with:
          name: pypulseq-cli-release-zip
          path: release

      - name: Download GUI release zip
        uses: actions/download-artifact@v4
        with:
          name: pypulseq-gui-release-zip
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/pypulseq-cli-windows.zip
            release/pypulseq-gui-windows.zip
