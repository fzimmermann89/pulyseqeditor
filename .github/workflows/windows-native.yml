name: Windows Native

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build native workspace
        run: cargo build --release
        working-directory: native

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: pypulseq-cli-windows
          path: native/target/release/pypulseq-cli.exe

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: pypulseq-gui-windows
          path: native/target/release/pypulseq-gui.exe
